name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: youtrack-external-time-tracking-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build YouTrack App
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Write release notes
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sh .gitlab/ci/release-notes.sh | sed 's#/-/compare/#/compare/#' > release-notes.md
          cat release-notes.md
          node .gitlab/ci/change-notes.mjs release-notes.md dist/manifest.json

      - name: Pack YouTrack App
        run: npm run pack

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE_NAME.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE_NAME.zip" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
