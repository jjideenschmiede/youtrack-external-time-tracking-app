<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>External Time Tracking</title>
    <style>
      :root {
        --page: #f7f8fa;
        --card: #fff;
        --line: #dfe1e5;
        --text: #1f2326;
        --muted: #6c707e;
        --main: #3574f0;
        --main-hover: #315fbd;
        --success: #208a3c;
        --success-tint: #e6f4ea;
        --error: #cc3645;
        --error-tint: #fbe9eb;
        --info-tint: #e7effd;
        --field: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1e1f22;
          --card: #2b2d30;
          --line: #43454a;
          --text: #dfe1e5;
          --muted: #9da0a8;
          --main: #548af7;
          --main-hover: #6b9bfa;
          --success: #5fb865;
          --success-tint: #253b2b;
          --error: #f0616d;
          --error-tint: #45262a;
          --info-tint: #25324d;
          --field: #1e1f22;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-size: 14px;
        line-height: 20px;
        color: var(--text);
        background: var(--page);
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px;
        padding: 40px 32px 32px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        border-radius: 50%;
        color: var(--main);
        background: var(--info-tint);
      }
      .badge svg {
        display: none;
        width: 28px;
        height: 28px;
      }
      body[data-state='done'] .badge {
        color: var(--success);
        background: var(--success-tint);
      }
      body[data-state='error'] .badge {
        color: var(--error);
        background: var(--error-tint);
      }
      body[data-state='done'] .icon-done,
      body[data-state='error'] .icon-error,
      body[data-state='manual'] .icon-manual {
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .code {
        display: none;
        width: 100%;
        min-height: 88px;
        margin-top: 20px;
        padding: 8px 12px;
        font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 18px;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        resize: none;
      }
      .code:focus {
        outline: 2px solid var(--main);
        outline-offset: -1px;
      }
      body[data-state='manual'] .code {
        display: block;
      }
      button {
        display: none;
        height: 32px;
        margin-top: 24px;
        padding: 0 16px;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--main);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: var(--main-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--main);
        outline-offset: 2px;
      }
      body[data-state='done'] #close,
      body[data-state='error'] #close,
      body[data-state='manual'] #copy {
        display: inline-block;
      }
      footer {
        margin-top: 28px;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">
        <svg class="icon-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
        <svg class="icon-manual" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16V6a2 2 0 0 1 2-2h8"/></svg>
      </div>
      <h1 id="title"></h1>
      <p id="text"></p>
      <textarea id="code" class="code" readonly spellcheck="false"></textarea>
      <button id="copy" type="button"></button>
      <button id="close" type="button"></button>
      <footer>External Time Tracking · YouTrack</footer>
    </main>
    <script>
      (function () {
        var texts = {
          en: {
            doneTitle: 'Account connected',
            doneText: 'The sign-in was successful. You can close this window and return to YouTrack.',
            errorTitle: 'Sign-in failed',
            manualTitle: 'One more step',
            manualText: 'Copy this code and paste it into the “Sign-in code” field in your YouTrack profile under “Time Tracking”.',
            emptyText: 'No sign-in code was received. Please start the sign-in again in your YouTrack profile.',
            close: 'Close window',
            copy: 'Copy code',
            copied: 'Copied'
          },
          de: {
            doneTitle: 'Konto verbunden',
            doneText: 'Die Anmeldung war erfolgreich. Du kannst dieses Fenster schließen und zu YouTrack zurückkehren.',
            errorTitle: 'Anmeldung fehlgeschlagen',
            manualTitle: 'Noch ein Schritt',
            manualText: 'Kopiere diesen Code und füge ihn in deinem YouTrack-Profil unter „Time Tracking“ in das Feld „Anmeldecode“ ein.',
            emptyText: 'Es wurde kein Anmeldecode empfangen. Bitte starte die Anmeldung in deinem YouTrack-Profil erneut.',
            close: 'Fenster schließen',
            copy: 'Code kopieren',
            copied: 'Kopiert'
          }
        };
        var german = (navigator.language || '').toLowerCase().indexOf('de') === 0;
        var t = german ? texts.de : texts.en;
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var error = params.get('error_description') || params.get('error');
        var delivered = false;
        try {
          if (window.opener) {
            window.opener.postMessage({
              source: 'external-time-tracking-oauth',
              code: code,
              state: params.get('state'),
              error: error
            }, '*');
            delivered = true;
          }
        } catch (e) {
          delivered = false;
        }
        var title = document.getElementById('title');
        var text = document.getElementById('text');
        var field = document.getElementById('code');
        var copy = document.getElementById('copy');
        var close = document.getElementById('close');
        document.documentElement.lang = german ? 'de' : 'en';
        close.textContent = t.close;
        copy.textContent = t.copy;
        close.addEventListener('click', function () {
          window.close();
        });
        copy.addEventListener('click', function () {
          field.focus();
          field.select();
          var done = function () {
            copy.textContent = t.copied;
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(field.value).then(done, function () {
              if (document.execCommand('copy')) {
                done();
              }
            });
          } else if (document.execCommand('copy')) {
            done();
          }
        });
        field.addEventListener('focus', function () {
          field.select();
        });
        if (error || !code) {
          document.body.dataset.state = 'error';
          title.textContent = t.errorTitle;
          text.textContent = error || t.emptyText;
        } else if (delivered) {
          document.body.dataset.state = 'done';
          title.textContent = t.doneTitle;
          text.textContent = t.doneText;
          window.setTimeout(function () {
            window.close();
          }, 1500);
        } else {
          document.body.dataset.state = 'manual';
          title.textContent = t.manualTitle;
          text.textContent = t.manualText;
          field.value = code;
        }
      })();
    </script>
  </body>
</html>
